<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4>My Wishlist</h4>
        <button class="btn btn-outline-danger btn-sm" 
                (click)="clearWishlist()"
                [disabled]="wishlistItems.length === 0">
          Clear Wishlist
        </button>
      </div>
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="input-group">
              <input type="text" 
                     class="form-control" 
                     placeholder="Search wishlist..."
                     [(ngModel)]="searchQuery"
                     (keyup.enter)="onSearch()">
              <button class="btn btn-primary" (click)="onSearch()">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </div>
        </div>
        
        <div *ngIf="wishlistItems.length === 0" class="text-center py-5">
          <i class="bi bi-heart display-1 text-muted"></i>
          <h5 class="mt-3">Your wishlist is empty</h5>
          <p class="text-muted">Add some products to your wishlist</p>
          <a routerLink="/shop" class="btn btn-primary">Browse Products</a>
        </div>
        
        <div *ngIf="filteredItems.length === 0 && wishlistItems.length > 0" class="text-center py-5">
          <h5>No items match your search</h5>
          <p class="text-muted">Try a different search term</p>
        </div>
        
        <div class="row" *ngIf="filteredItems.length > 0">
          <div class="col-md-6 col-lg-4 mb-4" *ngFor="let item of filteredItems">
            <div class="card h-100">
              <img [src]="item.image" 
                   class="card-img-top wishlist-item-image" 
                   [alt]="item.name">
              <div class="card-body">
                <h6 class="card-title">{{ item.name }}</h6>
                <p class="card-text text-primary">${{ item.price }}</p>
                <p class="card-text">
                  <small class="text-muted">
                    Added: {{ item.addedAt | date:'shortDate' }}
                  </small>
                </p>
              </div>
              <div class="card-footer">
                <div class="d-flex justify-content-between">
                  <button class="btn btn-primary btn-sm" 
                          (click)="addToCart(item)">
                    Add to Cart
                  </button>
                  <button class="btn btn-outline-danger btn-sm" 
                          (click)="removeFromWishlist(item.productId)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
