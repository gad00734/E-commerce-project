<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="bi bi-person-plus"></i>
      </div>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Join us and start your shopping journey</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label for="firstName" class="form-label">
              <i class="bi bi-person me-2"></i>First Name
            </label>
            <input type="text" 
                   class="form-control" 
                   id="firstName" 
                   [(ngModel)]="registerForm.firstName" 
                   name="firstName"
                   placeholder="Enter your first name"
                   required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="lastName" class="form-label">
              <i class="bi bi-person me-2"></i>Last Name
            </label>
            <input type="text" 
                   class="form-control" 
                   id="lastName" 
                   [(ngModel)]="registerForm.lastName" 
                   name="lastName"
                   placeholder="Enter your last name"
                   required>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="username" class="form-label">
          <i class="bi bi-at me-2"></i>Username
        </label>
        <input type="text" 
               class="form-control" 
               id="username" 
               [(ngModel)]="registerForm.username" 
               name="username"
               placeholder="Choose a username"
               required>
      </div>
      
      <div class="form-group">
        <label for="email" class="form-label">
          <i class="bi bi-envelope me-2"></i>Email Address
        </label>
        <input type="email" 
               class="form-control" 
               id="email" 
               [(ngModel)]="registerForm.email" 
               name="email"
               placeholder="Enter your email"
               required>
      </div>
      
      <div class="form-group">
        <label for="phone" class="form-label">
          <i class="bi bi-telephone me-2"></i>Phone Number
        </label>
        <input type="tel" 
               class="form-control" 
               id="phone" 
               [(ngModel)]="registerForm.phone" 
               name="phone"
               placeholder="Enter your phone number">
      </div>
      
      <div class="form-group">
        <label for="address" class="form-label">
          <i class="bi bi-geo-alt me-2"></i>Address
        </label>
        <textarea class="form-control" 
                  id="address" 
                  [(ngModel)]="registerForm.address" 
                  name="address"
                  placeholder="Enter your address"
                  rows="3"></textarea>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">
          <i class="bi bi-lock me-2"></i>Password
        </label>
        <input type="password" 
               class="form-control" 
               id="password" 
               [(ngModel)]="registerForm.password" 
               name="password"
               placeholder="Create a password"
               required>
      </div>
      
      <div class="form-group">
        <label for="confirmPassword" class="form-label">
          <i class="bi bi-lock-fill me-2"></i>Confirm Password
        </label>
        <input type="password" 
               class="form-control" 
               id="confirmPassword" 
               [(ngModel)]="registerForm.confirmPassword" 
               name="confirmPassword"
               placeholder="Confirm your password"
               required>
      </div>
      
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="terms" required>
        <label class="form-check-label" for="terms">
          I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a>
        </label>
      </div>
      
      <button type="submit" 
              class="btn btn-primary btn-lg w-100" 
              [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
        {{ isLoading ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>
    
    <div class="auth-footer">
      <p class="text-center">
        Already have an account? 
        <a href="#" (click)="onLoginClick()" class="auth-link">Sign in here</a>
      </p>
    </div>
    
    <div class="alert alert-danger mt-3" *ngIf="errorMessage">
      <i class="bi bi-exclamation-triangle me-2"></i>
      {{ errorMessage }}
    </div>
  </div>
</div>
