<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="bi bi-person-circle"></i>
      </div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to your account to continue shopping</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">
          <i class="bi bi-envelope me-2"></i>Email Address
        </label>
        <input type="email" 
               class="form-control" 
               id="email" 
               [(ngModel)]="loginForm.email" 
               name="email"
               placeholder="Enter your email"
               required>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">
          <i class="bi bi-lock me-2"></i>Password
        </label>
        <input type="password" 
               class="form-control" 
               id="password" 
               [(ngModel)]="loginForm.password" 
               name="password"
               placeholder="Enter your password"
               required>
      </div>
      
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>
      
      <button type="submit" 
              class="btn btn-primary btn-lg w-100" 
              [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
    
    <div class="auth-footer">
      <p class="text-center">
        Don't have an account? 
        <a href="#" (click)="onRegisterClick()" class="auth-link">Create one here</a>
      </p>
    </div>
    
    <div class="alert alert-danger mt-3" *ngIf="errorMessage">
      <i class="bi bi-exclamation-triangle me-2"></i>
      {{ errorMessage }}
    </div>
    
    <div class="demo-credentials">
      <h6><i class="bi bi-info-circle me-2"></i>Demo Credentials</h6>
             <div class="credential-item">
         <strong>Admin:</strong>
         <span>admin&#64;example.com / admin123</span>
       </div>
       <div class="credential-item">
         <strong>User:</strong>
         <span>john&#64;example.com / password123</span>
       </div>
    </div>
  </div>
</div>
