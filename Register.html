<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | E-Commerce</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-primary: #2D6A4F;
            --color-secondary: #95D5B2;
            --color-accent: #40916C;
            --color-light: #FFFFFF;
            --color-dark: #212529;
            --font-main: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--color-light);
        }

        .register-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--color-primary) 50%, var(--color-secondary) 50%);
        }

        .register-container {
            display: flex;
            flex-wrap: wrap;
            background: var(--color-light);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .register-left,
        .register-right {
            padding: 40px;
        }

        .register-left {
            background-color: var(--color-primary);
            color: var(--color-light);
            flex: 1;
            text-align: center;
        }

        .register-left h1 {
            font-size: 2rem;
            font-weight: 600;
        }

        .register-left p {
            margin-top: 10px;
            font-size: 1rem;
        }

        .register-right {
            flex: 1.5;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-primary {
            background-color: var(--color-primary);
            border: none;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--color-accent);
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
        }

        .register-footer a {
            text-decoration: none;
            color: var(--color-primary);
            font-weight: 600;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="register-wrapper">
        <div class="register-container">
            <!-- Left Side -->
            <div class="register-left d-none d-md-block">
                <div>
                    <img src="logo.png" alt="Logo" style="width: 100px; margin-bottom: 20px;">
                    <h1>Welcome!</h1>
                    <p>To join us, please create your personal account.</p>
                    <button class="btn btn-outline-light mt-4 px-4">Sign In</button>
                </div>
            </div>
            <!-- Right Side -->
            <div class="register-right">
                <h3 class="text-center mb-4">Create Account</h3>
                <p class="text-center">Register to start your journey</p>
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <div class="register-footer mt-3">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/register.js"></script>

</body>
</html>
