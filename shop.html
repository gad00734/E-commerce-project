<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop - ShopZone</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sticky Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">ShopZone</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="logout.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Filter Section -->
  <div class="container my-4">
    <h2 class="hero-title mb-3">Browse Products</h2>
    <div class="row g-2 mb-4">
      <div class="col-md-4">
        <select class="form-select" id="categoryFilter">
          <option selected value="all">All Categories</option>
          <option value="Phones">Phones</option>
          <option value="Laptops">Laptops</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
      <div class="col-md-8">
        <input type="text" id="searchInput" class="form-control" placeholder="Search products..." />
      </div>
    </div>

    <!-- Product Grid -->
    <div class="row" id="productGrid">
      <!-- Product 1 -->
      <div class="col-md-4 mb-4">
        <div class="product-card border rounded p-3 h-100">
            <img src="img/ip 14.jpg" class="img-fluid mb-2" style="width:300px; height:200px;" alt="iPhone 14"/>
          <h5>iPhone 14 Pro</h5>
          <p class="text-muted">$999.99</p>
          <p class="small">The latest Apple smartphone with A16 chip and ProMotion display.</p>
          <div class="d-grid gap-2">
            <button class="btn btn-primary">Add to Cart</button>
            <button class="btn btn-secondary">Add to Wishlist</button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-md-4 mb-4">
        <div class="product-card border rounded p-3 h-100">
            

            <img src="img/dell.jpg" class="img-fluid mb-2" style="width:300px; height:200px;" alt="Dell XPS"/>
          <h5>Dell XPS 13</h5>
          <p class="text-muted">$1,199.00</p>
          <p class="small">A sleek and powerful ultrabook with Intel i7 and 16GB RAM.</p>
          <div class="d-grid gap-2">
            <button class="btn btn-primary">Add to Cart</button>
            <button class="btn btn-secondary">Add to Wishlist</button>
          </div>
        </div>
      </div>

      

  <!-- Footer -->
  <footer class="bg-light text-center py-3">
    <div class="container">
      <p class="mb-0">&copy; 2025 ShopZone. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="js/shop.js"></script>
</body>
</html>
