<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E-Commerce</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-primary: #2D6A4F;
            --color-secondary: #95D5B2;
            --color-accent: #40916C;
            --color-light: #FFFFFF;
            --color-dark: #212529;
            --font-main: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--color-light);
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--color-primary) 50%, var(--color-secondary) 50%);
        }

        .login-container {
            display: flex;
            flex-wrap: wrap;
            background: var(--color-light);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .login-left,
        .login-right {
            padding: 40px;
        }

        .login-left {
            background-color: var(--color-primary);
            color: var(--color-light);
            flex: 1;
            text-align: center;
        }

        .login-left h1 {
            font-size: 2rem;
            font-weight: 600;
        }

        .login-left p {
            margin-top: 10px;
            font-size: 1rem;
        }

        .login-right {
            flex: 1.5;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-primary {
            background-color: var(--color-primary);
            border: none;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--color-accent);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
        }

        .login-footer a {
            text-decoration: none;
            color: var(--color-primary);
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Left Side -->
            <div class="login-left d-none d-md-block">
                <div>
                    
                    <h1>Welcome Back!</h1>
                    <p>To stay connected with us, please log in with your personal info.</p>
                </div>
            </div>
            <!-- Right Side -->
            <div class="login-right">
                <h3 class="text-center mb-4">Welcome</h3>
                <p class="text-center">Login to your account to continue</p>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe" class="form-label">Remember Me</label>
                        </div>
                        <a href="#" class="text-primary">Forgot your password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>
                <div class="login-footer mt-3">
                    <p>Don't have an account? <a href="Register.html">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/login.js"> </script>
</body>

</html>
