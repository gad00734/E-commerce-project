<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | E-Commerce</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <style>
    :root {
      --color-primary: #2D6A4F;
      --color-secondary: #95D5B2;
      --color-accent: #40916C;
      --color-light: #FFFFFF;
      --color-dark: #212529;
      --font-main: 'Poppins', sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--color-light);
      padding: 40px;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background-color: var(--color-primary);
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      padding: 20px;
      color: white;
      transition: transform 0.3s ease;
    }

    .sidebar.active {
      transform: translateX(-250px);
    }

    .sidebar h4 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .sidebar .list-group-item {
      background-color: var(--color-primary);
      color: white;
    }

    .sidebar .list-group-item:hover {
      background-color: var(--color-accent);
    }

    .content {
      flex-grow: 1;
      margin-left: 250px;
      padding: 20px;
    }

    .users-header {
      background-color: var(--color-primary);
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .btn-toggle-role {
      background-color: var(--color-accent);
      border: none;
      color: white;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .btn-toggle-role:hover {
      background-color: #1b4332;
    }

    table {
      border-radius: 10px;
      overflow: hidden;
    }

    .table thead {
      background-color: var(--color-secondary);
      color: var(--color-dark);
    }

    /* Mobile View */
    @media (max-width: 768px) {
      .content {
        margin-left: 0;
      }

      .sidebar {
        transform: translateX(-250px);
      }

      .sidebar.active {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar p-3" id="sidebar">
    <h4 class="text-white text-center mb-4">
      <i class="bi bi-shop-window"></i> Admin Panel
    </h4>
    <div class="list-group">
      <a href="dashboard.html" class="list-group-item list-group-item-action">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
      <a href="manage-products.html" class="list-group-item list-group-item-action">
        <i class="bi bi-box-seam me-2"></i> Manage Products
      </a>
      <a href="manage-categories.html" class="list-group-item list-group-item-action">
        <i class="bi bi-tags me-2"></i> Manage Categories
      </a>
      <a href="admin-orders.html" class="list-group-item list-group-item-action">
        <i class="bi bi-cart-check me-2"></i> Orders
      </a>
      <a href="users.html" class="list-group-item list-group-item-action">
        <i class="bi bi-person me-2"></i> Users
      </a>
      <a href="login.html" class="list-group-item list-group-item-action">
        <i class="bi bi-box-arrow-right me-2"></i> Logout
      </a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content p-4 w-100">
    <!-- Sidebar Toggle Button for Mobile -->
    <button class="btn btn-success d-md-none m-3" id="toggleSidebar">
      <i class="bi bi-list"></i> Menu
    </button>

    <div class="container">
      <div class="users-header text-center">
        <h2>User Management</h2>
        <p>Manage roles and access for registered users</p>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-success" id="addUserBtn">Add User</button>
        <button class="btn btn-outline-danger" id="logoutBtn">Logout</button>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered text-center" id="userTable">
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal for Add/Edit User -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="userForm">
          <div class="modal-header">
            <h5 class="modal-title" id="userModalLabel">Add / Edit User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editIndex">
            <div class="mb-3">
              <label for="userEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="userEmail" required>
            </div>
            <div class="mb-3">
              <label for="userPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="userPassword" required>
            </div>
            <div class="mb-3">
              <label for="userRole" class="form-label">Role</label>
              <select class="form-select" id="userRole" required>
                <option value="customer">Customer</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('active');
    });
  </script>
  <script src="./js/users.js"></script>
</body>
</html>
