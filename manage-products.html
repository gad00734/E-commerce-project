<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Products - Admin Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>

<body>
    <div class="admin-container d-flex">
        <!-- Sidebar -->
        <div class="admin-sidebar p-3" id="sidebar">
            <h4 class="text-white text-center mb-4">
                <i class="bi bi-shop-window"></i> Admin Panel
            </h4>
            <div class="list-group">
                <a href="dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
                <a href="manage-products.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-box-seam me-2"></i> Manage Products
                </a>
                <a href="manage-categories.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-tags me-2"></i> Manage Categories
                </a>
                <a href="admin-orders.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-cart-check me-2"></i> Orders
                </a>
                <a href="users.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-person me-2"></i> Users
                </a>
                <a href="#" onclick="handleLogout()" class="list-group-item list-group-item-action">
                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="admin-content p-4 w-100">
            <!-- Sidebar Toggle Button for Mobile -->
            <button class="btn btn-success d-md-none m-3" id="toggleSidebar">
                <i class="bi bi-list"></i> Menu
            </button>

            <div class="container">
                <div class="products-header text-center">
                    <h2>Product Management</h2>
                    <p>Manage your products</p>
                </div>

                <!-- Add New Product -->
                <form id="addProductForm" class="mb-4" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" id="productTitle" class="form-control" placeholder="Product Title" required />
                        </div>
                        <div class="col-md-6">
                            <input type="number" id="productPrice" class="form-control" placeholder="Price" step="0.01" min="0" required />
                        </div>
                        <div class="col-md-4">
                            <select id="productCategory" class="form-control" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <input type="number" id="productQuantity" class="form-control" placeholder="Quantity" min="0" step="1" required />
                        </div>
                        <div class="col-md-4">
                            <input type="file" id="productImage" class="form-control" accept="image/*" required />
                        </div>
                        <div class="col-12">
                            <textarea id="productDescription" class="form-control" placeholder="Product Description" rows="3" required></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Add Product</button>
                        </div>
                    </div>
                </form>

                <!-- Products Table -->
                <section id="products" class="mt-5">
                    <h3>Products List</h3>
                    <div class="table-responsive">
                        <table class="table table-bordered admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Image</th>
                                    <th>Title</th>
                                    <th>Price</th>
                                    <th>Category</th>
                                    <th>Quantity</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsList">
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Edit Product Modal -->
                <div class="modal fade" id="editProductModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Edit Product</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="editProductForm" enctype="multipart/form-data">
                                    <input type="hidden" id="editProductId" />
                                    <div class="mb-3">
                                        <label class="form-label">Title</label>
                                        <input type="text" id="editProductTitle" class="form-control" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Price</label>
                                        <input type="number" id="editProductPrice" class="form-control" step="0.01" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Category</label>
                                        <select id="editProductCategory" class="form-control" required>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Quantity</label>
                                        <input type="number" id="editProductQuantity" class="form-control" min="0" step="1" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Description</label>
                                        <textarea id="editProductDescription" class="form-control" rows="3" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Image</label>
                                        <input type="file" id="editProductImage" class="form-control" accept="image/*" />
                                    </div>
                                    <button type="submit" class="btn btn-primary">Save Changes</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleLogout() {
            localStorage.removeItem("loggedInUser");
            window.location.href = "login.html";
        }

        const toggleBtn = document.getElementById('toggleSidebar');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });
    </script>
    <script src="js/manage-products.js"></script>
</body>

</html>
